; The API's request pool.
;
; php:8.3-fpm ships pm.max_children = 5, which is the whole concurrency of the
; API. The storyboard page opens with a BURST — auth/me, billing/me, the
; storyboard itself, the player payload, the style preview — and the payload
; calls are not cheap, so five children are all busy within a second of the
; page loading. Everything after that queues behind Docker Desktop's Windows
; port proxy, which resets a connection it has been holding for 30 seconds:
; the browser reports `net::ERR_CONNECTION_RESET` at 30.0s on whichever calls
; lost the race, which looks like a server crash and is really a queue.
;
; Sized for this machine, not for a server: the Docker VM is 3.6 GB and shares
; it with mysql, redis and the python services, so the pool is bounded rather
; than generous. A child of this app sits around 40 MB, so 10 children is about
; 400 MB at full load and idles at three.

[www]
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Recycle a child after 500 requests: a long-lived FPM child in a memory-tight
; VM is where a slow leak turns into swapping.
pm.max_requests = 500

; A request still running after five minutes is wedged, not slow — the render
; and the analysis run on the QUEUE, not here. Matches max_execution_time so
; PHP's own limit fires first and leaves a stack trace in the log.
request_terminate_timeout = 310
