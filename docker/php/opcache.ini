; php:8.3-fpm ships OPcache but leaves it OFF, so every request recompiled all
; of Laravel (~1,000 files). Turning it on is the single biggest per-request win.
opcache.enable=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=30000

; Dev: re-check a file's mtime at most every 2s, so edits still show up
; without a restart. Production sets PHP_OPCACHE_VALIDATE_TIMESTAMPS=0 (never
; re-check: fastest, but a deploy then needs `docker compose restart app`).
opcache.validate_timestamps=${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq=2

; Path lookups are slow across the Windows -> Linux bind mount; cache them.
realpath_cache_size=4096K
realpath_cache_ttl=120
