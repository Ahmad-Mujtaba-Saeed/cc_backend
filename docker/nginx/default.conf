server {
    listen 80;
    index index.php index.html;
    root /var/www/public;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static storage assets (uploads, AI props, narration). The Remotion render
    # service loads these cross-origin from its bundler (http://localhost:3001)
    # and Chromium requires CORS for CSS mask-image fetches (PropSprite).
    # `^~` makes this prefix win over the `\.php$` regex below. Without it a
    # request for /storage/.../anything.php was handed to PHP-FPM, so an
    # uploaded file with a .php name would have been EXECUTED. Storage is
    # static, always.
    location ^~ /storage {
        add_header Access-Control-Allow-Origin * always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    client_max_body_size 500M;

    location ~ \.php$ {
        # Resolve `app` through Docker's DNS on each lookup (cached 10s), not
        # once at nginx start: a recreated app container gets a new IP and the
        # pinned one turned every request into a 502 until nginx restarted.
        resolver 127.0.0.11 valid=10s;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }


    # OAuth discovery for the MCP studio (/.well-known/oauth-protected-resource,
    # /.well-known/oauth-authorization-server) is served by Laravel. `^~` so
    # the dotfile deny below does not swallow it.
    location ^~ /.well-known/ {
        try_files $uri /index.php?$query_string;
    }

    location ~ /\. {
        deny all;
    }
}
