server {
    listen 80;
    index index.php index.html;
    root /var/www/public;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static storage assets (uploads, AI props, narration). The Remotion render
    # service loads these cross-origin from its bundler (http://localhost:3001)
    # and Chromium requires CORS for CSS mask-image fetches (PropSprite).
    # `^~` makes this prefix win over the `\.php$` regex below. Without it a
    # request for /storage/.../anything.php was handed to PHP-FPM, so an
    # uploaded file with a .php name would have been EXECUTED. Storage is
    # static, always.
    location ^~ /storage {
        add_header Access-Control-Allow-Origin * always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    client_max_body_size 500M;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }


    location ~ /\. {
        deny all;
    }
}
