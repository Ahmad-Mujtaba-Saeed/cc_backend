version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
    environment:
      - PYTHON_AI_SERVICE_URL=http://ai:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql
      - redis
      - ai
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - app_net

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    # Run as www-data — the SAME user php-fpm serves web requests as.
    #
    # Both processes write into storage/app/public, and Laravel creates
    # directories 0755 owned by whoever got there first. With the worker as
    # root, any project folder the worker created first was root:root 0755, and
    # the next web request (www-data) could not mkdir inside it:
    # "Unable to create a directory at /var/www/storage/app/public/projects/4/
    # explainer". 44 of 51 project folders were in that state. Matching the
    # users is what actually fixes it; chowning only clears the backlog.
    user: www-data
    # reap-stale runs on boot because a worker restart is the most common way a
    # project is orphaned mid-render, and this stack has no scheduler process.
    # `|| true` so a reap failure can never stop the queue from starting.
    command: sh -c "sleep 20 && php artisan migrate --force && (php artisan projects:reap-stale || true) && php artisan queue:work --queue=video-processing --sleep=1 --tries=3"
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
    environment:
      - PYTHON_AI_SERVICE_URL=http://ai:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql
      - redis
      - ai
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - app_net

  ai:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    volumes:
      - .:/app
      - ./storage:/app/storage
      # The PHP app/worker containers mount the project at /var/www and hand
      # absolute paths (e.g. /var/www/storage/app/public/...) to this service.
      # Mount the same host files at /var/www here too so those paths resolve.
      - .:/var/www
      - ./storage:/var/www/storage
      - hf_cache:/root/.cache/huggingface
      - torch_cache:/root/.cache/torch
    environment:
      - HF_HUB_DISABLE_IMPLICIT_TOKEN=1
    mem_limit: 6g
    mem_reservation: 3g
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - app_net

  nginx:
    image: nginx:alpine
    ports:
      - "8086:80"
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app_net

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: video_processor
      MYSQL_USER: video_processor
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_net

  redis:
    image: redis:alpine
    networks:
      - app_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "8087:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - app_net

volumes:
  mysql_data:
  hf_cache:
  torch_cache:

networks:
  app_net:
