# What starts:
#   docker compose up -d                     core: nginx, app, worker, mysql, redis
#                                            (+ every profile listed in COMPOSE_PROFILES in .env)
#   docker compose --profile ai up -d        + ai      (whisper timings, demucs, faces, ffmpeg tools —
#                                                      renders and the shorts templates need it)
#   docker compose --profile voice up -d     + voice cloning (voice + voice-worker, ~3 GB RAM)
#   docker compose --profile tools up -d     + phpmyadmin
# .env ships COMPOSE_PROFILES=ai so a plain `up` can render; blank it to run
# just the API (dashboard/storyboard work) on a small machine.

# One PHP image for app, worker and voice-worker: built once, not once each.
x-php: &php
  image: viralforge-php:latest
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  volumes:
    - .:/var/www
    - ./storage:/var/www/storage
    # vendor/ lives in a Linux volume, NOT the Windows bind mount: a file stat
    # across the mount costs ~1 ms vs ~0.01 ms here, and Laravel touches
    # ~1,500 vendor files a request (measured: a bare 401 took 3-4 s). The
    # volume is filled from the image on first start. After changing
    # composer.json/lock run:  docker compose exec app composer install
    - vendor:/var/www/vendor
  dns:
    - 8.8.8.8
    - 1.1.1.1
  networks:
    - app_net

services:
  app:
    <<: *php
    environment:
      - PYTHON_AI_SERVICE_URL=http://ai:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No depends_on `ai`: the API serves without it, and depending on it forced
    # the 13 GB AI container up just to load the dashboard.
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    <<: *php
    # Run as www-data — the SAME user php-fpm serves web requests as.
    #
    # Both processes write into storage/app/public, and Laravel creates
    # directories 0755 owned by whoever got there first. With the worker as
    # root, any project folder the worker created first was root:root 0755, and
    # the next web request (www-data) could not mkdir inside it:
    # "Unable to create a directory at /var/www/storage/app/public/projects/4/
    # explainer". 44 of 51 project folders were in that state. Matching the
    # users is what actually fixes it; chowning only clears the backlog.
    user: www-data
    # reap-stale runs on boot because a worker restart is the most common way a
    # project is orphaned mid-render, and this stack has no scheduler process.
    # `|| true` so a reap failure can never stop the queue from starting.
    # (Waits on mysql's healthcheck instead of the old `sleep 20`.)
    command: sh -c "php artisan migrate --force && (php artisan projects:reap-stale || true) && php artisan queue:work --queue=video-processing --sleep=1 --tries=3"
    environment:
      - PYTHON_AI_SERVICE_URL=http://ai:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # `app` first: both mount the empty `vendor` volume and Docker fills it from
    # the image on first mount — created together, they race and one dies with
    # "mkdir …/vendor/_data/aws: file exists" (every fresh machine hit this).
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # Cloning + stand-alone text-to-speech jobs ("My Voices") on their own queue
  # connection, so a long render never makes a user wait for their voice and
  # a slow CPU synthesis never holds up a render.
  voice-worker:
    <<: *php
    profiles: ["voice"]
    user: www-data
    command: sh -c "php artisan queue:work voice --queue=voice --sleep=2 --tries=1 --timeout=3000"
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      voice:
        condition: service_started

  # Voice cloning TTS: Chatterbox-Nano (Resemble AI, MIT). Its own image
  # because chatterbox-tts pins torch/transformers versions the `ai` image
  # cannot share. Storage is mounted at the SAME path as the PHP containers so
  # file paths pass through unchanged; app.py is mounted so edits apply on a
  # restart without a rebuild.
  voice:
    profiles: ["voice"]
    build:
      context: ./docker/voice
    volumes:
      - ./storage:/var/www/storage
      - ./docker/voice/app.py:/srv/app.py:ro
      - hf_cache:/root/.cache/huggingface
    environment:
      - VOICE_STORAGE_ROOT=/var/www/storage
    mem_limit: 3g
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - app_net

  ai:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    volumes:
      - .:/app
      - ./storage:/app/storage
      # The PHP app/worker containers mount the project at /var/www and hand
      # absolute paths (e.g. /var/www/storage/app/public/...) to this service.
      # Mount the same host files at /var/www here too so those paths resolve.
      - .:/var/www
      - ./storage:/var/www/storage
      - hf_cache:/root/.cache/huggingface
      - torch_cache:/root/.cache/torch
    environment:
      - HF_HUB_DISABLE_IMPLICIT_TOKEN=1
    mem_limit: 6g
    mem_reservation: 3g
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - app_net

  nginx:
    image: nginx:alpine
    ports:
      - "8086:80"
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app_net

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: video_processor
      MYSQL_USER: video_processor
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    # 127.0.0.1 (TCP), not localhost (socket): during first-boot init MySQL
    # answers on the socket before it accepts the network connections the app uses.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    networks:
      - app_net

  # Holds the queue, cache and sessions: persisted so recreating the
  # container doesn't drop queued renders or log everyone out.
  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    profiles: ["tools"]
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "8087:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - app_net

volumes:
  mysql_data:
  redis_data:
  vendor:
  hf_cache:
  torch_cache:

networks:
  app_net:
